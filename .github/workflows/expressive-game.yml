name: Expressive game soundtrack smoke
on:
  pull_request:
    paths:
      - 'handheld-v16.js'
      - 'tests/game-expression-v16.test.cjs'
      - 'index.html'
      - '.github/workflows/expressive-game.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check handheld-v16.js
          node tests/game-expression-v16.test.cjs
