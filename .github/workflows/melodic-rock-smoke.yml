name: Melodic rock smoke
on:
  pull_request:
    paths:
      - 'band-piano-v15.js'
      - 'tests/melodic-rock-v15.test.cjs'
      - 'index.html'
      - 'app-v13.js'
      - '.github/workflows/melodic-rock-smoke.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check band-piano-v15.js
          node tests/melodic-rock-v14.test.cjs
          node tests/melodic-rock-v15.test.cjs
