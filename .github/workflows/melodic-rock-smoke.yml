name: Melodic rock smoke
on:
  pull_request:
    paths:
      - 'band-piano-v15.js'
      - 'tests/melodic-rock-v15.test.cjs'
      - 'index.html'
      - 'app-v13.js'
      - '.github/workflows/melodic-rock-smoke.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check band-piano-v14.js
          node tests/melodic-rock-v14.test.cjs
