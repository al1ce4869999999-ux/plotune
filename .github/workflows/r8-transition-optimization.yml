name: R8 transition optimization validation
on:
  push:
    branches: [feature/r8-transition-optimization]
  pull_request:
    paths:
      - 'transition-optimization-r8.js'
      - 'handheld-v21.js'
      - 'index.html'
      - 'tests/transition-optimization-r8.test.cjs'
      - 'tests/r8-real-strategy-audit.test.cjs'
      - '.github/workflows/r8-transition-optimization.yml'
jobs:
  real-strategy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit real generated note strategy coverage
        run: node tests/r8-real-strategy-audit.test.cjs
  r8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R8 syntax and real generation
        run: |
          node --check transition-optimization-r8.js
          node --check handheld-v21.js
          node tests/transition-optimization-r8.test.cjs
  regression:
    name: R0-R7 regressions (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: R5-R7
            tests: 'tests/transition-evaluation-r7.test.cjs tests/arrangement-optimization-r6.test.cjs tests/arrangement-perception-r5.test.cjs'
          - group: R0-R4
            tests: 'tests/r4-m7-real-engine.test.cjs tests/r3-m7-real-engine.test.cjs tests/r0-m7-integration.test.cjs'
          - group: contracts
            tests: 'tests/motif-similarity-r1.test.cjs tests/m2-emotion-phrase.test.cjs tests/preflight-contracts.test.cjs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run impacted regressions
        shell: bash
        run: |
          for test_file in ${{ matrix.tests }}; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
