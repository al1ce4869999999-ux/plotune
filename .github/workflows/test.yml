name: Plotune engine tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check analyzer.js
          node --check resonare.js
          node --check composer.js
          node --check composer-v04.js
          node --check app.js
          node --check app-v03.js
          node --check app-v04.js
      - name: Run no-API engine tests
        run: |
          node tests/engine.test.cjs
          node tests/resonare.test.cjs
          node tests/structural.test.cjs
