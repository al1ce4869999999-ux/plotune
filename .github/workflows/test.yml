          node tests/ui-v08.test.cjs || failed=1
          node tests/loop-v09.test.cjs || failed=1
          node tests/ui-v09.test.cjs || failed=1
          node tests/handheld-v10.test.cjs || failed=1
          node tests/ponpon-v11.test.cjs || failed=1
