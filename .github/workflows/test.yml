name: Plotune engine tests
concurrency:
  group: plotune-engine-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/m7-1-four-condition-generation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check analyzer.js
          node --check resonare.js
          node --check composer.js
          node --check composer-v04.js
          node --check motif-planner-v01.js
          node --check band-v05.js
          node --check band-v07.js
          node --check resonare-v08.js
          node --check band-v08.js
          node --check comparison-v08.js
          node --check app-v08.js
          node --check loop-arranger-v09.js
          node --check band-v09.js
          node --check app-v09.js
          node --check handheld-v10.js
          node --check handheld-v11.js
          node --check handheld-v16.js
          node --check handheld-v17.js
          node --check handheld-v18.js
          node --check handheld-v19.js
          node --check handheld-v20.js
          node --check m-contract-v01.js
          node --check m-comparison-v01.js
          node --check m1-motif-registry-v01.js
          node --check m1-motif-transform-v01.js
          node --check m1-section-history-v01.js
          node --check m2-emotion-phrase-v01.js
          node --check m3-harmony-melody-v01.js
          node --check m3-tonal-journey-v01.js
          node --check m4-voice-dialogue-v01.js
          node --check m5-performance-v01.js
          node --check handheld-v21.js
          node --check app-v11.js
          node --check comparison-v10.js
          node --check app-v10.js
          node --check zeta-export-v12.js
          node --check app-v12.js
          node --check band-piano-v13.js
          node --check band-piano-v14.js
          node --check band-piano-v15.js
          node --check comparison-v13.js
          node --check m6-quality-v01.js
          node --check m6-integration-v01.js
          node --check m7-generation-v01.js
          node --check m7-listening-v01.js
          node --check m7-evaluation-v01.js
          node --check m7-diagnostics-v01.js
          node --check m7-aggregate-v01.js
          node --check m7-worker-v01.js
          node --check m7-trial-ui-v01.js
          node --check app-v13.js
          node --check app.js
          node --check app-v03.js
          node --check app-v04.js
          node --check app-v05.js
          node --check comparison-v06.js
          node --check app-v06.js
          node --check app-v062.js
          node --check app-v07.js
      - name: Preflight UI and asset contracts
        run: node tests/preflight-contracts.test.cjs
      - name: Run no-API engine tests
        run: |
          failed=0
          node tests/engine.test.cjs || failed=1
          node tests/emotion-plan-phase1.test.cjs || failed=1
          node tests/emotion-audio-phase1.test.cjs || failed=1
          node tests/emotion-first-composition.test.cjs || failed=1
          node tests/motif-planner-v01.test.cjs || failed=1
          node tests/motif-phrase-integration.test.cjs || failed=1
          node tests/m0-contract.test.cjs || failed=1
          node tests/m0-comparison.test.cjs || failed=1
          node tests/m1-motif-registry.test.cjs || failed=1
          node tests/m1-motif-transform.test.cjs || failed=1
          node tests/m1-section-history.test.cjs || failed=1
