name: Plotune engine tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check analyzer.js
          node --check resonare.js
          node --check composer.js
          node --check composer-v04.js
          node --check band-v05.js
          node --check band-v07.js
          node --check resonare-v08.js
          node --check band-v08.js
          node --check comparison-v08.js
          node --check app-v08.js
          node --check loop-arranger-v09.js
          node --check band-v09.js
          node --check app-v09.js
          node --check handheld-v10.js
          node --check handheld-v11.js
          node --check handheld-v16.js
          node --check app-v11.js
          node --check comparison-v10.js
          node --check app-v10.js
          node --check zeta-export-v12.js
          node --check app-v12.js
          node --check band-piano-v13.js
          node --check band-piano-v14.js
          node --check band-piano-v15.js
          node --check comparison-v13.js
          node --check app-v13.js
          node --check app.js
          node --check app-v03.js
          node --check app-v04.js
          node --check app-v05.js
          node --check comparison-v06.js
          node --check app-v06.js
          node --check app-v062.js
          node --check app-v07.js
      - name: Run no-API engine tests
        run: |
          node tests/engine.test.cjs
          node tests/resonare.test.cjs
          node tests/structural.test.cjs
          node tests/band.test.cjs
          node tests/band-v07.test.cjs
          node tests/practice-v08.test.cjs
          node tests/ui-v08.test.cjs
          node tests/loop-v09.test.cjs
          node tests/ui-v09.test.cjs
          node tests/handheld-v10.test.cjs
          node tests/ponpon-v11.test.cjs
          node tests/game-expression-v16.test.cjs
          node tests/ui-v10.test.cjs
          node tests/zeta-export-v12.test.cjs
          node tests/ui-v12.test.cjs
          node tests/band-piano-v13.test.cjs
          node tests/melodic-rock-v14.test.cjs
          node tests/melodic-rock-v15.test.cjs
          node tests/ui-v13.test.cjs
          node tests/ui-v07.test.cjs
          node tests/ui-v05.test.cjs
          node tests/comparison-v06.test.cjs
          node tests/ui-v06.test.cjs
          node tests/cache-v062.test.cjs
          node tests/ui-v04.test.cjs
