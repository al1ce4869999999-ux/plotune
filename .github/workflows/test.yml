          node tests/motif-score-integration.test.cjs || failed=1
          node tests/phase2-ab-lab.test.cjs || failed=1
          node tests/phase2-main-comparison.test.cjs || failed=1
          node tests/m3-harmony-ab-ui.test.cjs || failed=1
          node tests/phase3-expressive-ab.test.cjs || failed=1
          node tests/m6-quality.test.cjs || failed=1
          node tests/m6-integration.test.cjs || failed=1
          node tests/m7-m6-integration.test.cjs || failed=1
          node tests/m7-browser-wiring.test.cjs || failed=1
