name: Scene instrument smoke
on:
  pull_request:
    paths:
      - 'handheld-v18.js'
      - 'tests/instrument-auto-v18.test.cjs'
      - 'index.html'
      - '.github/workflows/instrument-smoke.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check handheld-v18.js
          node tests/instrument-auto-v18.test.cjs
