name: Grief gravity smoke
on:
  pull_request:
    paths:
      - 'handheld-v21.js'
      - 'tests/grief-gravity-v21.test.cjs'
      - '.github/workflows/grief-gravity.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check handheld-v21.js
          node tests/grief-gravity-v21.test.cjs
