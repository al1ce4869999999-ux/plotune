name: Piano-unison smoke
on:
  pull_request:
    paths:
      - 'band-piano-v13.js'
      - 'app-v13.js'
      - 'comparison-v13.js'
      - 'tests/band-piano-v13.test.cjs'
      - 'tests/ui-v13.test.cjs'
      - '.github/workflows/piano-smoke.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  piano:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check band-piano-v13.js
          node --check comparison-v13.js
          node --check app-v13.js
          node tests/band-piano-v13.test.cjs
          node tests/ui-v13.test.cjs
