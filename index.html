<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121420">
<meta name="description" content="キャラクターのプロフィール、世界観、シーンからブラウザだけでBGMを作るPlotune。API不要、無料の作曲ツール。">
<title>Plotune — 物語からBGMを作る</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color-scheme:dark;background:#111320;color:#f7f3ff;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#302548 0,#171a2b 45%,#111320 90%);min-height:100vh}
main{max-width:740px;padding:24px 17px calc(45px + env(safe-area-inset-bottom));margin:auto}
h1{font-size:clamp(30px,7vw,42px);margin:4px 0 6px;letter-spacing:-1px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:17px;margin:0 0 14px}
h4{font-size:14px;margin:15px 0 8px}
p{line-height:1.65}
.lead{color:#c8c2da;margin:0 0 25px}
.card{background:#212337;border:1px solid #403c53;border-radius:19px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #05061020}
label{display:block;font-weight:650;font-size:14px;margin:15px 0 7px}
textarea,input,select{width:100%;font:inherit;color:#fff;background:#121522;border:1px solid #5c5970;border-radius:11px;padding:13px;outline:none}
textarea:focus,input:focus,select:focus{border-color:#b39fff;box-shadow:0 0 0 2px #a796ff22}
textarea{min-height:94px;resize:vertical;line-height:1.55}
select{appearance:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
button{touch-action:manipulation;border:1px solid transparent;border-radius:12px;background:#b3a0ff;color:#161326;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:#32344c;border-color:#59556c;color:#f7f3ff}
button:disabled{opacity:.38;cursor:default}
button:focus-visible{outline:3px solid white;outline-offset:2px}
.note,.muted{color:#bcb7d0}
.note{font-size:13px}
#summary{color:#e1d8ff;font-size:14px;margin:4px 0 10px}
#status{min-height:26px;color:#d3c6ff;font-size:14px;margin-top:12px}
#status.error{color:#ff9caa}
.report{display:grid;gap:12px}
.report-row{display:flex;justify-content:space-between;gap:20px;font-size:14px;align-items:baseline}
.report-row strong{text-align:right}
.explain{color:#bbb8cd;font-size:13px;margin:10px 0}
.arc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.arc-item{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#e0d8f6}
.arc-bar{background:#131526;border:1px solid #49415c;border-radius:10px;height:77px;width:100%;display:flex;align-items:flex-end;overflow:hidden}
.arc-fill{width:100%;background:linear-gradient(0deg,#8671e9,#d3bfff);border-radius:7px 7px 0 0}
#analysis[hidden]{display:none}
.footer{font-size:12px;color:#aca6bf;line-height:1.7;padding:0 2px}
@media(max-width:380px){.two{grid-template-columns:1fr}.card{padding:16px}.actions button{flex:1}}
</style>
<script defer src="analyzer.js"></script>
<script defer src="composer.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main>
<header>
<h1>🎼 Plotune <small style="font-size:13px;color:#c0aaff;vertical-align:middle">v0.2</small></h1>
<p class="lead">物語のシーンを、キャラクターらしい音楽に。</p>
</header>
<section class="card">
<h2>✍️ 物語の設定</h2>
<label for="title">作品名</label>
<input id="title" placeholder="たぬきの里 など">
<label for="character">キャラクターのプロフィール</label>
<textarea id="character" placeholder="性格、口調、行動、関係性、印象的な特徴など"></textarea>
<label for="world">世界観・設定</label>
<textarea id="world" placeholder="舞台、季節、時代、物語の雰囲気など"></textarea>
<label for="scene">今回のシーン</label>
<textarea id="scene" style="min-height:145px" placeholder="例：ぽんぽんは得意げにほうきを持ち上げた。ところが畳に引っかかり、ころんと転ぶ。しばらくして、もう一度そっと挑戦する。"></textarea>
<div class="two">
<div><label for="style">曲調</label><select id="style">
<option value="auto">🎭 物語から自動判定</option>
<option value="chip">🎮 8bit・コミカル</option>
<option value="piano">🎹 ピアノ風</option>
<option value="horror">🌘 ホラー・不穏</option>
<option value="pop">✨ ポップ</option>
<option value="fantasy">🪄 ファンタジー</option>
<option value="ambient">🌙 アンビエント</option>
</select></div>
<div><label for="duration">長さ</label><select id="duration"><option value="15">15秒</option><option value="30" selected>30秒</option><option value="60">60秒</option></select></div>
</div>
<div class="actions">
<button id="analyze" class="alt" type="button">🔍 文章を解析</button>
<button id="make" type="button">✨ 自動作曲</button>
<button id="save" class="alt" type="button">設定を保存</button>
</div>
</section>
<section class="card" id="analysis" hidden aria-live="polite"></section>
<section class="card">
<h2>🎶 プレイヤー</h2>
<p id="summary">まだ曲を作成していません。</p>
<div class="actions">
<button id="play" disabled type="button">▶ 再生</button>
<button id="stop" class="alt" disabled type="button">■ 停止</button>
<button id="reroll" class="alt" disabled type="button">↻ 別アレンジ</button>
<button id="wav" class="alt" disabled type="button">↓ WAV保存</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
</section>
<p class="footer">外部API・ログイン・通信での曲生成は不要。端末内で文章を簡易解析し、メロディー・和音・伴奏を合成します。文章の理解はキーワードとルールに基づく推定で、AIによる意味理解とは異なります。保存済みの設定はこのブラウザに残ります。</p>
</main>
</body>
</html>
