<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Plotune 音楽印象ラボ</title>
<style>body{margin:0;background:#151522;color:#f5f1ff;font:16px -apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 64px}section{border:1px solid #4c4664;background:#222338;padding:16px;border-radius:15px;margin:15px 0}textarea,select,input{width:100%;box-sizing:border-box;background:#121423;color:white;border:1px solid #67617f;padding:11px;border-radius:9px;font:inherit}textarea{height:90px}label{display:block;margin:13px 0 5px}button{background:#baaaff;border:0;border-radius:10px;padding:12px;margin:6px 6px 6px 0;font:inherit;font-weight:700;color:#191525}button:disabled{opacity:.4}.hint{color:#c7c0df;font-size:13px;line-height:1.6}h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}.rating{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rating label{font-size:13px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#151627;padding:12px;border-radius:10px}a{color:#d8cbff}</style>
<script defer src="analyzer.js"></script><script defer src="resonare-v08.js"></script><script defer src="loop-arranger-v09.js"></script><script defer src="story-structure-v01.js?v=20261018-psych1"></script><script defer src="music-psychology-v01.js?v=20261019-research1"></script><script defer src="melodic-grammar-v01.js?v=20261022-phrases1"></script><script defer src="handheld-v21.js?v=20261022-harmony1"></script></head>
<body><main><h1>🎼 Plotune 音楽印象ラボ</h1><p class="hint">世界観・出来事を固定して人物だけ変えるA/B実験。通常の作曲画面には影響しません。音楽心理学の傾向と創作仮説を混同しないための開発用ページです。</p>
<section><h2>音楽表現パラメータ辞書</h2><div id="dictionary"></div></section>
<section><h2>キャラ比較テスト</h2>
<label>キャラA</label><textarea id="characterA">ぽんぽんは小さな男の子。好奇心旺盛で元気。ちょこちょこ動き、ぴょんぴょん跳ねる。</textarea>
<label>キャラB</label><textarea id="characterB">ゆきは静かで慎重な男の子。おとなしく、内気で人見知り。ゆっくりと動く。</textarea>
<label>共通の世界観</label><textarea id="world">木造の家が建つ静かな村。あたたかな午後。</textarea>
<label>共通の出来事</label><textarea id="scene">楽しみにしていたおやつを落として、しょんぼりとうつむく。</textarea>
<label>感情プリセット</label><select id="style"><option value="sadness">哀・しょんぼり</option><option value="joy">喜・うれしい</option><option value="fear">こわい</option><option value="journey">冒険</option></select>
<button id="generate">同じ条件で2曲を作る</button><p id="status" role="status" class="hint">未生成</p>
<button id="playA" disabled>Aを再生</button><button id="playB" disabled>Bを再生</button><button id="stop" disabled>停止</button>
<pre id="diagnosis">作曲後に音符列の差を表示します。</pre></section>
<section><h2>印象評価（1〜5）</h2><p class="hint">評価は音楽から実際に感じた印象。狙いどおりだったかは聴いて判断。評価はこの端末内にのみ保存されます。</p><div id="ratings"></div>
<button id="save">評価を記録</button><button id="export">記録をJSONで保存</button><p id="saved" class="hint"></p>
</section><p class="hint"><a href="./">通常のPlotuneへ戻る</a></p></main>
<script>
window.addEventListener('load',()=>{
const $=id=>document.getElementById(id);
const D=[
 ['tempo','テンポ','速いほど活動的・覚醒的になりやすい','研究傾向'],
 ['register','音域','高音は軽さ、低音は重さを連想させうる','文脈依存の傾向'],
 ['contour','旋律輪郭','上昇は前進、下降は沈静の印象を生みやすい','研究傾向'],
 ['articulation','音の切れ方','短い音は歯切れ、長い音は滑らかさを作る','研究傾向'],
 ['dynamics','強弱','強い音・鋭い開始は緊張や強さを表すことがある','研究傾向'],
 ['dissonance','不協和','粗い響きは緊張・不安の手がかり','研究傾向'],
 ['reverb','残響','直接音対残響比は空間や距離の印象に関係する','音響研究'],
 ['bounce','跳躍率','幼い・活発なキャラに跳躍を増やす','Plotune仮説'],
 ['hesitation','休符・躊躇','慎重なキャラに間を増やす','Plotune仮説'],
 ['story','主題変奏','出来事に応じて元のキャラ主題を変化させる','Plotune仮説']
];
$('dictionary').innerHTML=D.map(x=>'<p><b>'+x[1]+'</b> <small>（'+x[3]+'）</small><br><span class="hint">'+x[2]+'</span></p>').join('');
const dimensions=[['bounce','跳ねる印象'],['weight','音の重さ'],['child','幼さ'],['grief','悲しみの深さ'],['space','空間の広さ']];
$('ratings').innerHTML=['A','B'].map(c=>'<h3>曲'+c+'</h3><div class="rating">'+dimensions.map(([id,label])=>'<label>'+label+'<select id="'+c+id+'">'+[1,2,3,4,5].map(v=>'<option value="'+v+'"'+(v===3?' selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div>').join('');
let tracks={},ctx=null,node=null;
function stop(){if(node){try{node.stop()}catch{}node=null;}}
$('stop').onclick=stop;
function input(char){return {title:'音楽印象ラボ',character:char,world:$('world').value,scene:$('scene').value,style:'handheld',duration:'30',engine:'resonare',gameStyle:$('style').value};}
function build(char){const obj=input(char),analysis=PlotuneAnalysis.analyze(obj);const plan=PlotuneAnalysis.plan(obj,analysis,0);const structure=PlotuneStoryStructure.analyze(obj);const expression=PlotuneMusicPsychology.derive(structure,obj.gameStyle);const p={...PlotuneHandheld.prepare(plan,obj.gameStyle,null,false,obj.scene,[char,obj.world,obj.scene].join('\n')),structure,expression};return PlotuneHandheld.render(p);}
$('generate').onclick=()=>{stop();try{tracks.A=build($('characterA').value);tracks.B=build($('characterB').value);for(const id of ['playA','playB','stop'])$(id).disabled=false;const a=tracks.A.score.notes.filter(n=>n.voice==='lead'),b=tracks.B.score.notes.filter(n=>n.voice==='lead');const comparable=Math.min(a.length,b.length);let diff=0;for(let i=0;i<comparable;i++)if(a[i].midi!==b[i].midi||Math.abs(a[i].t-b[i].t)>.001||Math.abs(a[i].d-b[i].d)>.001)diff++;$('diagnosis').textContent='A 主旋律 '+a.length+'音 / B '+b.length+'音\n対応する音の違い '+diff+'/'+comparable+'件\n※音符差は聴感の差と同義ではありません。';$('status').textContent='2曲生成完了';}catch(e){$('status').textContent='作曲エラー：'+e.message;console.error(e);}};
async function play(c){try{stop();const t=tracks[c];if(!t)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const buffer=ctx.createBuffer(1,t.samples.length,t.sampleRate);buffer.copyToChannel(t.samples,0);node=ctx.createBufferSource();node.buffer=buffer;node.connect(ctx.destination);node.start();$('status').textContent=c+'を再生中';}catch(e){$('status').textContent='再生エラー：'+e.message;}}
$('playA').onclick=()=>play('A');$('playB').onclick=()=>play('B');
$('save').onclick=()=>{try{const items=JSON.parse(localStorage.getItem('plotune_impressions')||'[]');items.push({at:new Date().toISOString(),style:$('style').value,characterA:$('characterA').value,characterB:$('characterB').value,world:$('world').value,scene:$('scene').value,ratings:Object.fromEntries(['A','B'].flatMap(c=>dimensions.map(([id])=>[c+'_'+id,Number($(c+id).value)])))});localStorage.setItem('plotune_impressions',JSON.stringify(items));$('saved').textContent=items.length+'件保存済み';}catch(e){$('saved').textContent='保存失敗：'+e.message;}};
$('export').onclick=()=>{const blob=new Blob([localStorage.getItem('plotune_impressions')||'[]'],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='plotune-impressions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
});
</script></body></html>
